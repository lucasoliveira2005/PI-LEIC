<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RANPilot</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #212121;
      --surface: #2f2f2f;
      --surface2: #3d3d3d;
      --border: #444;
      --accent: #10a37f;
      --accent-hover: #0d8f6f;
      --text: #ececec;
      --text-muted: #8e8ea0;
      --user-bubble: #2f2f2f;
      --radius: 12px;
      --sidebar-w: 220px;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 0 24px; height: 56px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .tabs { display: flex; gap: 4px; margin-left: auto; }
    .tab-btn {
      padding: 6px 18px; border-radius: 8px; border: none;
      background: transparent; color: var(--text-muted);
      cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s;
    }
    .tab-btn.active { background: var(--surface); color: var(--text); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Pages ── */
    .page { display: none; flex: 1; overflow: hidden; }
    .page.active { display: flex; }

    /* ══════════════════════════════
       CHAT PAGE
    ══════════════════════════════ */
    #chat-page { flex-direction: column; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 24px 0;
      display: flex; flex-direction: column; gap: 0;
    }

    .msg {
      max-width: 720px; width: 100%; margin: 0 auto;
      padding: 12px 24px; display: flex; gap: 14px; align-items: flex-start;
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .bubble { background: var(--user-bubble); border-radius: var(--radius) var(--radius) 4px var(--radius); }
    .msg.assistant .bubble { background: transparent; border-radius: var(--radius) var(--radius) var(--radius) 4px; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    }
    .avatar.user { background: #5b5fc7; color: #fff; }
    .avatar.assistant { background: var(--accent); color: #fff; }

    .bubble { padding: 10px 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

    .typing-dot { display: inline-block; width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: blink 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

    .chat-footer {
      flex-shrink: 0; padding: 16px 24px 24px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
    }

    .chat-input-wrap {
      max-width: 720px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; display: flex; align-items: flex-end; gap: 8px; padding: 10px 14px;
    }
    .chat-input-wrap:focus-within { border-color: var(--accent); }

    .backend-chip {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 4px 8px;
      font-size: 13px; flex-shrink: 0; align-self: flex-end; margin-bottom: 2px;
      white-space: nowrap;
    }

    #chat-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; resize: none; max-height: 200px;
      line-height: 1.5; min-height: 24px;
    }
    #chat-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: background .15s; align-self: flex-end;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled { background: var(--surface2); cursor: not-allowed; }
    #send-btn svg { width: 16px; height: 16px; }

    /* ══════════════════════════════
       DASHBOARD PAGE
    ══════════════════════════════ */
    #dashboard-page { flex-direction: column; overflow-y: auto; padding: 24px; gap: 20px; }

    .dash-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.ok { background: #22c55e; }
    .status-dot.error { background: #ef4444; }
    #refresh-btn {
      margin-left: auto; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
    }
    #refresh-btn:hover { background: var(--surface); }

    .stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px;
    }
    .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat-card .value { font-size: 26px; font-weight: 700; color: var(--text); }
    .stat-card .unit { font-size: 12px; color: var(--text-muted); }

    .charts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .chart-card h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .chart-card canvas { max-height: 200px; }

    .alerts-section { display: flex; flex-direction: column; gap: 8px; }
    .alerts-section h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .alert-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 14px;
    }
    .alert-item.critical { border-left: 3px solid #ef4444; }
    .alert-item.warning  { border-left: 3px solid #f59e0b; }
    .alert-item.info     { border-left: 3px solid #3b82f6; }
    .no-alerts { color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

<header>
  <span class="logo">RANPilot</span>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat">Chat</button>
    <button class="tab-btn" data-tab="dashboard">Dashboard</button>
  </nav>
</header>

<!-- ══ CHAT ══ -->
<div id="chat-page" class="page active">
  <div class="chat-messages" id="messages">
    <div class="msg assistant">
      <div class="avatar assistant">R</div>
      <div class="bubble">Olá! Sou o RANPilot, o teu agente de rede 5G. Faz-me uma pergunta sobre o estado da rede.</div>
    </div>
  </div>
  <div class="chat-footer">
    <div class="chat-input-wrap">
      <span class="backend-chip" id="backend-chip">Backend: …</span>
      <textarea id="chat-input" rows="1" placeholder="Pergunta sobre a rede…"></textarea>
      <button id="send-btn" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashboard-page" class="page">
  <div class="dash-status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">A carregar…</span>
    <button id="refresh-btn">↻ Atualizar</button>
  </div>

  <div class="stat-cards" id="stat-cards"></div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>Throughput DL por célula (Mbps)</h3>
      <canvas id="chart-dl"></canvas>
    </div>
    <div class="chart-card">
      <h3>Throughput UL por célula (Mbps)</h3>
      <canvas id="chart-ul"></canvas>
    </div>
    <div class="chart-card">
      <h3>SINR por UE (dB)</h3>
      <canvas id="chart-sinr"></canvas>
    </div>
    <div class="chart-card">
      <h3>BLER por UE (%)</h3>
      <canvas id="chart-bler"></canvas>
    </div>
  </div>

  <div class="alerts-section">
    <h3>Alertas</h3>
    <div id="alerts-list"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   TABS
═══════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(target + '-page').classList.add('active');
    if (target === 'dashboard') {
      startDashboardPolling();
    } else {
      stopDashboardPolling();
    }
  });
});

/* ═══════════════════════════════════════
   CHAT
═══════════════════════════════════════ */
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const sendBtn    = document.getElementById('send-btn');
const backendChip = document.getElementById('backend-chip');

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const data = await res.json();
    backendChip.textContent = 'Backend: ' + (data.backend_label || data.backend || 'desconhecido');
  } catch (e) {
    backendChip.textContent = 'Backend: desconhecido';
  }
}

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `
    <div class="avatar ${role}">${role === 'user' ? 'U' : 'R'}</div>
    <div class="bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function appendTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="avatar assistant">R</div>
    <div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const question = inputEl.value.trim();
  if (!question) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  appendMsg('user', question);
  const typing = appendTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    typing.remove();
    appendMsg('assistant', data.answer || data.error || 'Sem resposta.');
  } catch (e) {
    typing.remove();
    appendMsg('assistant', 'Erro ao contactar o agente. Certifica-te que o servidor está a correr.');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadConfig();

/* ═══════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════ */
const charts = {};
let dashboardTimer = null;
let dashboardActive = false;
const chartHistory = {
  labels: [],
  dl: {},
  ul: {},
  sinr: {},
  bler: {},
};
const MAX_POINTS = 60;

function mkChart(id, type, labels, datasets, opts = {}) {
  const ctx = document.getElementById(id).getContext('2d');
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { labels: { color: '#ececec', font: { size: 12 } } } },
      scales: {
        x: { ticks: { color: '#8e8ea0', font: { size: 11 } }, grid: { color: '#3d3d3d' } },
        y: { ticks: { color: '#8e8ea0', font: { size: 11 } }, grid: { color: '#3d3d3d' } }
      },
      ...opts
    }
  });
}

const COLORS = ['#10a37f','#5b5fc7','#f59e0b','#ef4444','#3b82f6','#a855f7'];
const POLL_MS = 2000;

function startDashboardPolling() {
  dashboardActive = true;
  loadDashboard();
  if (!dashboardTimer) dashboardTimer = setInterval(loadDashboard, POLL_MS);
}

function stopDashboardPolling() {
  dashboardActive = false;
  if (dashboardTimer) {
    clearInterval(dashboardTimer);
    dashboardTimer = null;
  }
}

async function loadDashboard() {
  if (!dashboardActive && !document.getElementById('dashboard-page').classList.contains('active')) return;
  try {
    const [health, metrics, alerts] = await Promise.all([
      fetch('/api/health', { cache: 'no-store' }).then(r => r.json()),
      fetch('/api/metrics', { cache: 'no-store' }).then(r => r.json()),
      fetch('/api/alerts', { cache: 'no-store' }).then(r => r.json()),
    ]);

    renderStatus(health);
    const snapshot = normalizeMetrics(metrics);
    renderStats(health, snapshot);
    renderCharts(snapshot);
    renderAlerts(alerts);
  } catch (e) {
    document.getElementById('status-text').textContent = 'Erro ao carregar dados.';
    document.getElementById('status-dot').className = 'status-dot error';
  }
}

function renderStatus(health) {
  const ok = (health.status || '').toLowerCase() === 'ok';
  document.getElementById('status-dot').className = 'status-dot ' + (ok ? 'ok' : 'error');
  const ts = health.timestamp || (health.snapshot || {}).timestamp;
  const suffix = ts ? ' · ' + new Date(ts).toLocaleTimeString() : '';
  document.getElementById('status-text').textContent = (ok ? 'Rede saudável' : ('Estado: ' + (health.status || 'desconhecido'))) + suffix;
}

function normalizeMetrics(metrics) {
  if ((metrics.cells || metrics.ues) && Array.isArray(metrics.ues)) {
    return {
      timestamp: metrics.timestamp,
      cells: metrics.cells || [],
      ues: metrics.ues || [],
    };
  }

  const cellsById = {};
  const ues = [];
  (metrics.items || []).forEach(item => {
    const src = item.source_id || 'gnb';
    (item.entities || []).forEach(e => {
      const ue = e.ue || {};
      const cellId = `${src}-cell-${e.cell_index ?? 0}`;
      if (!cellsById[cellId]) cellsById[cellId] = { cell_id: cellId, pci: e.pci ?? null };
      const ok = ue.dl_nof_ok || 0;
      const nok = ue.dl_nof_nok || 0;
      ues.push({
        ue_id: e.ue_identity || ue.rnti || 'UE',
        cell_id: cellId,
        radio_quality: {
          sinr_db: ue.sinr_db ?? ue.pucch_snr_db ?? ue.pusch_snr_db ?? null,
          dl_snr_db: ue.dl_snr_db ?? ue.pucch_snr_db ?? null,
          ul_snr_db: ue.ul_snr_db ?? ue.pusch_snr_db ?? null,
        },
        throughput: {
          dl_goodput_mbps: Number(ue.dl_goodput_mbps ?? ue.dl_brate ?? 0),
          ul_goodput_mbps: Number(ue.ul_goodput_mbps ?? ue.ul_brate ?? 0),
        },
        reliability: {
          dl_bler: ok + nok > 0 ? nok / (ok + nok) : Number(ue.dl_bler ?? 0),
        },
      });
    });
  });

  return {
    timestamp: metrics.timestamp,
    cells: Object.values(cellsById),
    ues,
  };
}

function renderStats(health, snapshot) {
  const snap = health.snapshot || {};

  let totalDL = 0, totalUL = 0;
  snapshot.ues.forEach(ue => {
    totalDL += Number((ue.throughput || {}).dl_goodput_mbps || 0);
    totalUL += Number((ue.throughput || {}).ul_goodput_mbps || 0);
  });

  const cards = [
    { label: 'Células', value: snapshot.cells.length || snap.sources || 0, unit: '' },
    { label: 'UEs', value: snapshot.ues.length, unit: '' },
    { label: 'DL Total', value: totalDL.toFixed(1), unit: 'Mbps' },
    { label: 'UL Total', value: totalUL.toFixed(1), unit: 'Mbps' },
    { label: 'Actualizado', value: snapshot.timestamp ? new Date(snapshot.timestamp).toLocaleTimeString() : '—', unit: '' },
  ];

  document.getElementById('stat-cards').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="unit">${c.unit}</div>
    </div>`).join('');
}

function pushPoint(store, key, value) {
  if (!store[key]) store[key] = [];
  store[key].push(value);
  while (store[key].length > MAX_POINTS) store[key].shift();
}

function trimStore(store, labelsLength) {
  Object.values(store).forEach(values => {
    while (values.length > labelsLength) values.shift();
    while (values.length < labelsLength) values.unshift(null);
  });
}

function makeDatasets(store) {
  return Object.keys(store).sort().map((key, i) => ({
    label: key,
    data: store[key],
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length] + '33',
    borderWidth: 2,
    pointRadius: 1,
    tension: 0.25,
  }));
}

function upsertLineChart(id, datasets) {
  if (!charts[id]) {
    mkChart(id, 'line', chartHistory.labels, datasets, {
      animation: false,
      elements: { line: { fill: false } },
    });
    return;
  }
  charts[id].data.labels = chartHistory.labels;
  charts[id].data.datasets = datasets;
  charts[id].update('none');
}

function renderCharts(snapshot) {
  const cellDL = {}, cellUL = {};
  const sinr = {}, bler = {};

  snapshot.ues.forEach(ue => {
    const cell = ue.cell_id || 'cell-0';
    const tp = ue.throughput || {};
    const rq = ue.radio_quality || {};
    const rel = ue.reliability || {};
    const label = `${ue.ue_id || 'UE'} @ ${cell}`;

    cellDL[cell] = (cellDL[cell] || 0) + Number(tp.dl_goodput_mbps || 0);
    cellUL[cell] = (cellUL[cell] || 0) + Number(tp.ul_goodput_mbps || 0);
    sinr[label] = Number(rq.sinr_db ?? rq.dl_snr_db ?? rq.ul_snr_db ?? 0);
    bler[label] = Number(rel.dl_bler ?? 0) * 100;
  });

  const ts = snapshot.timestamp ? new Date(snapshot.timestamp) : new Date();
  chartHistory.labels.push(ts.toLocaleTimeString());
  while (chartHistory.labels.length > MAX_POINTS) chartHistory.labels.shift();

  Object.entries(cellDL).forEach(([key, value]) => pushPoint(chartHistory.dl, key, +value.toFixed(2)));
  Object.entries(cellUL).forEach(([key, value]) => pushPoint(chartHistory.ul, key, +value.toFixed(2)));
  Object.entries(sinr).forEach(([key, value]) => pushPoint(chartHistory.sinr, key, +value.toFixed(1)));
  Object.entries(bler).forEach(([key, value]) => pushPoint(chartHistory.bler, key, +value.toFixed(2)));

  trimStore(chartHistory.dl, chartHistory.labels.length);
  trimStore(chartHistory.ul, chartHistory.labels.length);
  trimStore(chartHistory.sinr, chartHistory.labels.length);
  trimStore(chartHistory.bler, chartHistory.labels.length);

  upsertLineChart('chart-dl', makeDatasets(chartHistory.dl));
  upsertLineChart('chart-ul', makeDatasets(chartHistory.ul));
  upsertLineChart('chart-sinr', makeDatasets(chartHistory.sinr));
  upsertLineChart('chart-bler', makeDatasets(chartHistory.bler));
}

function renderAlerts(alerts) {
  const list = document.getElementById('alerts-list');
  const items = alerts.items || alerts.alerts || [];
  if (!items.length) {
    list.innerHTML = '<div class="no-alerts">Sem alertas activos.</div>';
    return;
  }
  list.innerHTML = items.map(a => `
    <div class="alert-item ${(a.severity || 'info').toLowerCase()}">
      <strong>${a.name || a.type || 'Alerta'}</strong> — ${a.message || a.description || ''}
    </div>`).join('');
}

document.getElementById('refresh-btn').addEventListener('click', loadDashboard);
</script>
</body>
</html>
